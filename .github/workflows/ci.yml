name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # web/dist/ no se versiona (M10a): go:embed necesita que exista y
      # tenga contenido para que CUALQUIER go build/vet/test compile, así
      # que el frontend se construye antes de tocar nada de Go.
      - name: Build frontend (web/dist)
        run: cd web && npm ci && npm run build
      - name: Formato
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Tests
        run: go test ./...
      - name: Tests frontend
        run: cd web && npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: windows, goarch: amd64, ext: ".exe" }
          - { goos: linux,   goarch: amd64, ext: "" }
          - { goos: darwin,  goarch: amd64, ext: "" }
          - { goos: darwin,  goarch: arm64, ext: "" }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe necesita las etiquetas
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build frontend (web/dist)
        run: cd web && npm ci && npm run build
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          PKG=github.com/bigbendja/gala/internal/buildinfo
          VERSION="$(git describe --tags --always --dirty)"
          COMMIT="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go build -trimpath \
            -ldflags "-s -w -X ${PKG}.Version=${VERSION} -X ${PKG}.Commit=${COMMIT} -X ${PKG}.Date=${DATE}" \
            -o "dist/gala-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" ./cmd/gala
      - uses: actions/upload-artifact@v4
        with:
          name: gala-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  # Se dispara solo con etiquetas v*: publica un binario por plataforma (sin
  # ffmpeg, que en servidor se instala con apt) y el fichero de checksums.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum gala-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Notas de la versión
        id: notes
        run: |
          # Notas desde CHANGELOG.md si existe; si no, las autogenera GitHub.
          if [ -f CHANGELOG.md ]; then echo "file=CHANGELOG.md" >> "$GITHUB_OUTPUT"; fi
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/gala-*
            dist/SHA256SUMS.txt
          body_path: ${{ steps.notes.outputs.file }}
          generate_release_notes: ${{ steps.notes.outputs.file == '' }}
          draft: false
