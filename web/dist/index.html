<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GALA</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
  <header>
    <h1>▶ GALA</h1>
    <span id="ffmpegBadge" class="badge" hidden>ffmpeg no disponible: sin conversión de formatos</span>
  </header>
  <main>
    <section id="gallery" class="grid"></section>

    <section id="playerView" hidden>
      <button id="backBtn">&larr; Volver a la galería</button>
      <h2 id="playerTitle"></h2>
      <video id="video" controls playsinline></video>
      <div id="rejectPanel" class="panel" hidden>
        <p id="rejectReason"></p>
        <div class="copy-actions">
          <button id="copyLinkBtn" class="btn-secondary">Copiar enlace</button>
          <button id="copyPathBtn" class="btn-secondary" hidden>Copiar ruta del archivo</button>
        </div>
        <p class="hint">Pégalo en un reproductor externo (Medio &rarr; Abrir ubicación de red).</p>
      </div>
      <div id="analyzingPanel" class="panel" hidden>
        <p>Analizando el archivo&hellip;</p>
      </div>
      <div id="sourceList" class="sources"></div>
    </section>
  </main>
  <div id="toast" class="toast" hidden></div>

  <script src="/vendor/hls.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
